<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON BIKE</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05050a;
    font-family: "Segoe UI", Arial, sans-serif;
    touch-action: none;
  }

  canvas {
    display: block;
    touch-action: none;
  }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #eafcff;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    background: radial-gradient(
      circle at center,
      rgba(13, 5, 45, 0.15),
      rgba(2, 1, 10, 0.52)
    );
  }

  #overlay.hidden {
    display: none;
  }

  #overlay h1 {
    font-size: clamp(38px, 8vw, 62px);
    letter-spacing: 6px;
    color: #00eaff;
    text-shadow: 0 0 20px #00eaff, 0 0 40px #ff00e0;
    margin-bottom: 10px;
  }

  #overlay h2 {
    font-size: clamp(28px, 6vw, 40px);
    color: #ff4d6d;
    text-shadow: 0 0 15px #ff4d6d;
    margin-bottom: 14px;
  }

  #overlay p {
    font-size: clamp(15px, 3.6vw, 19px);
    margin: 6px 0;
    color: #c9f7ff;
  }

  #overlay .hint {
    margin-top: 26px;
    font-size: clamp(17px, 4vw, 21px);
    color: #ffe95c;
    text-shadow: 0 0 12px #ffe95c;
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    display: none;
    justify-content: space-between;
    gap: 10px;
    color: #dffcff;
    font-size: clamp(14px, 3.5vw, 20px);
    text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
    pointer-events: none;
  }

  #hud span {
    color: #ffe95c;
    text-shadow: 0 0 8px #ffe95c;
  }

  @media (max-width: 600px) {
    #hud {
      top: 10px;
      left: 10px;
      right: 10px;
      flex-direction: column;
      gap: 2px;
    }

    #hud > div:last-child {
      align-self: flex-end;
    }
  }
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div>
    Дистанция: <span id="hudDist">0</span> м
    &nbsp;&nbsp;
    Монеты: <span id="hudCoins">0</span>
  </div>

  <div>
    Рекорд: <span id="hudBest">0</span> м
  </div>
</div>

<div id="overlay">
  <h1 id="ovTitle">NEON BIKE</h1>
  <h2 id="ovSub" style="display:none;"></h2>
  <p id="ovLine1"></p>
  <p id="ovLine2"></p>
  <p id="ovLine3"></p>
  <p class="hint" id="ovHint">Пробел / Клик / Тап — начать</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const overlay = document.getElementById("overlay");
const hud = document.getElementById("hud");

const hudDist = document.getElementById("hudDist");
const hudCoins = document.getElementById("hudCoins");
const hudBest = document.getElementById("hudBest");

const ovTitle = document.getElementById("ovTitle");
const ovSub = document.getElementById("ovSub");
const ovLine1 = document.getElementById("ovLine1");
const ovLine2 = document.getElementById("ovLine2");
const ovLine3 = document.getElementById("ovLine3");
const ovHint = document.getElementById("ovHint");

let W = 0;
let H = 0;
let groundBaseline = 0;

const BIKE_SCREEN_X = () => Math.min(220, W * 0.22);

const GRAVITY = 2000;
const JUMP_VEL = 800;
const BASE_SPEED = 260;
const MAX_SPEED = 680;
const WHEEL_R = 20;

let gameState = "menu";
let scrollX = 0;
let speed = BASE_SPEED;

let flightOffset = 0;
let flightVel = 0;
let isFlying = false;

let obstacles = [];
let coins = [];
let particles = [];

let nextObstacleWorldX = 900;
let nextCoinWorldX = 500;

let coinsCollected = 0;
let bestDistance = Number(localStorage.getItem("neonbike_best") || 0);

let crashTimer = 0;
let animTime = 0;
let lastTime = performance.now();

let stars = [];
let buildings = [];

const TILE_W = 3000;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  groundBaseline = H * 0.62;

  initStars();
  initCity();
}

window.addEventListener("resize", resize);

function hillHeight(x) {
  return (
    Math.sin(x * 0.0022) * 38 +
    Math.sin(x * 0.0009 + 1.1) * 66 +
    Math.sin(x * 0.0055 + 0.6) * 14
  );
}

function groundYAt(worldX) {
  return groundBaseline - hillHeight(worldX);
}

function worldToScreenX(worldX) {
  return BIKE_SCREEN_X() + (worldX - scrollX);
}

function initStars() {
  stars = [];

  const count = Math.max(70, Math.floor(W / 10));

  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      r: Math.random() * 1.6 + 0.4,
      ph: Math.random() * 10
    });
  }
}

function initCity() {
  buildings = [];

  let x = 0;

  while (x < TILE_W) {
    const w = 40 + Math.random() * 70;
    const h = 60 + Math.random() * 180;

    buildings.push({
      x,
      w,
      h,
      lit: Math.random() < 0.6
    });

    x += w + 10 + Math.random() * 30;
  }
}

function showOverlay(show) {
  overlay.classList.toggle("hidden", !show);
}

function setHudVisible(show) {
  hud.style.display = show ? "flex" : "none";
}

function updateHud() {
  hudDist.textContent = Math.floor(scrollX / 10);
  hudCoins.textContent = coinsCollected;
  hudBest.textContent = bestDistance;
}

function backToMenuInit() {
  ovTitle.style.display = "block";
  ovSub.style.display = "none";

  ovLine1.textContent = "Пробел / Клик / Тап — прыжок";
  ovLine2.textContent = "Перепрыгивай камни и пропасти!";
  ovLine3.textContent = "Рекорд: " + bestDistance + " м";
  ovHint.textContent = "Пробел / Клик / Тап — начать";

  showOverlay(true);
  setHudVisible(false);
}

function startGame() {
  gameState = "playing";

  scrollX = 0;
  speed = BASE_SPEED;

  flightOffset = 0;
  flightVel = 0;
  isFlying = false;

  obstacles = [];
  coins = [];
  particles = [];

  nextObstacleWorldX = 900;
  nextCoinWorldX = 500;

  coinsCollected = 0;
  crashTimer = 0;

  showOverlay(false);
  setHudVisible(true);
  updateHud();
}

function endGame() {
  if (gameState !== "playing") return;

  gameState = "crash";
  crashTimer = 0;

  const bikeX = BIKE_SCREEN_X();
  const bikeY = groundYAt(scrollX) - flightOffset - WHEEL_R;

  for (let i = 0; i < 32; i++) {
    const angle = Math.random() * Math.PI * 2;
    const force = 80 + Math.random() * 280;

    particles.push({
      x: bikeX,
      y: bikeY,
      vx: Math.cos(angle) * force,
      vy: Math.sin(angle) * force - 100,
      life: 0.55 + Math.random() * 0.55,
      age: 0,
      color: Math.random() < 0.5 ? "#ff4d6d" : "#ffbd4d",
      r: 2 + Math.random() * 3
    });
  }
}

function finalizeGameOver() {
  gameState = "gameover";

  const distanceMeters = Math.floor(scrollX / 10);

  if (distanceMeters > bestDistance) {
    bestDistance = distanceMeters;
    localStorage.setItem("neonbike_best", bestDistance);
  }

  updateHud();

  ovTitle.style.display = "none";
  ovSub.style.display = "block";
  ovSub.textContent = "АВАРИЯ!";

  ovLine1.textContent = "Дистанция: " + distanceMeters + " м";
  ovLine2.textContent = "Монеты: " + coinsCollected;
  ovLine3.textContent = "Рекорд: " + bestDistance + " м";
  ovHint.textContent = "Пробел / Клик / Тап — заново";

  showOverlay(true);
}

function onInput() {
  if (gameState === "menu" || gameState === "gameover") {
    startGame();
    return;
  }

  if (gameState === "playing") {
    if (!isFlying && flightOffset <= 0) {
      flightVel = JUMP_VEL;
      isFlying = true;
      createJumpParticles();
    }
  }
}

function createJumpParticles() {
  for (let i = 0; i < 9; i++) {
    particles.push({
      x: BIKE_SCREEN_X() - 26,
      y: groundYAt(scrollX) - 6,
      vx: -80 - Math.random() * 120,
      vy: -20 - Math.random() * 80,
      life: 0.25 + Math.random() * 0.2,
      age: 0,
      color: "#00eaff",
      r: 1 + Math.random() * 2.5
    });
  }
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;

  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    onInput();
  }
});

window.addEventListener("mousedown", onInput);

window.addEventListener("touchstart", (e) => {
  e.preventDefault();
  onInput();
}, { passive: false });

function maybeSpawnObstacle() {
  const aheadLimit = scrollX + W + 700;

  while (nextObstacleWorldX < aheadLimit) {
    const difficulty = Math.min(1, scrollX / 12000);
    const gap = 500 - difficulty * 180 + Math.random() * 260;
    const type = Math.random() < 0.55 ? "rock" : "pit";

    if (type === "rock") {
      obstacles.push({
        worldX: nextObstacleWorldX,
        type,
        width: 42 + Math.random() * 34,
        height: 32 + Math.random() * 30
      });
    } else {
      obstacles.push({
        worldX: nextObstacleWorldX,
        type,
        width: 100 + Math.random() * 80
      });
    }

    nextObstacleWorldX += Math.max(350, gap);
  }
}

function maybeSpawnCoin() {
  const aheadLimit = scrollX + W + 700;

  while (nextCoinWorldX < aheadLimit) {
    if (Math.random() < 0.75) {
      coins.push({
        worldX: nextCoinWorldX,
        h: 65 + Math.random() * 80,
        collected: false
      });
    }

    nextCoinWorldX += 210 + Math.random() * 250;
  }
}

function isOverPit(worldX) {
  for (const o of obstacles) {
    if (o.type !== "pit") continue;

    const left = o.worldX - o.width / 2;
    const right = o.worldX + o.width / 2;

    if (worldX > left && worldX < right) {
      return true;
    }
  }

  return false;
}

function update(dt) {
  animTime += dt;

  if (gameState === "playing") {
    scrollX += speed * dt;
    speed = Math.min(MAX_SPEED, BASE_SPEED + scrollX * 0.018);

    if (isFlying) {
      flightVel -= GRAVITY * dt;
      flightOffset += flightVel * dt;

      if (flightOffset <= 0) {
        if (isOverPit(scrollX)) {
          endGame();
        } else {
          flightOffset = 0;
          flightVel = 0;
          isFlying = false;
        }
      }
    } else if (isOverPit(scrollX)) {
      endGame();
    }

    maybeSpawnObstacle();
    maybeSpawnCoin();

    const bikeWorldX = scrollX;
    const bikeHalfW = 24;

    for (const o of obstacles) {
      const dx = o.worldX - bikeWorldX;

      if (Math.abs(dx) < bikeHalfW + o.width / 2) {
        if (o.type === "rock" && flightOffset < o.height + 8) {
          endGame();
          break;
        }
      }
    }

    for (const c of coins) {
      if (c.collected) continue;

      const dx = c.worldX - bikeWorldX;

      if (Math.abs(dx) < 30 && Math.abs(c.h - flightOffset) < 38) {
        c.collected = true;
        coinsCollected++;

        for (let i = 0; i < 10; i++) {
          particles.push({
            x: worldToScreenX(c.worldX),
            y: groundYAt(c.worldX) - c.h,
            vx: (Math.random() - 0.5) * 220,
            vy: (Math.random() - 0.5) * 220,
            life: 0.35 + Math.random() * 0.3,
            age: 0,
            color: "#ffe95c",
            r: 1.5 + Math.random() * 2.5
          });
        }
      }
    }

    obstacles = obstacles.filter((o) => o.worldX > bikeWorldX - 250);
    coins = coins.filter((c) => !c.collected && c.worldX > bikeWorldX - 250);

    if (!isFlying && gameState === "playing" && Math.random() < 0.55) {
      particles.push({
        x: BIKE_SCREEN_X() - 18,
        y: groundYAt(bikeWorldX) - 2,
        vx: -speed * 0.35 + Math.random() * 40,
        vy: -20 - Math.random() * 30,
        life: 0.35,
        age: 0,
        color: "#8fdcff",
        r: 1.5 + Math.random() * 2
      });
    }

    updateHud();
  }

  if (gameState === "crash") {
    crashTimer += dt;

    if (crashTimer > 0.9) {
      finalizeGameOver();
    }
  }

  for (const p of particles) {
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
  }

  particles = particles.filter((p) => p.age < p.life);
}

function drawSky() {
  const gradient = ctx.createLinearGradient(0, 0, 0, H);

  gradient.addColorStop(0, "#05030d");
  gradient.addColorStop(0.55, "#0d0630");
  gradient.addColorStop(1, "#1a0a2e");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(animTime * 2 + s.ph);

    ctx.globalAlpha = 0.25 + 0.75 * twinkle;
    ctx.fillStyle = "#eaf6ff";

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

function drawMoon() {
  const mx = W * 0.82;
  const my = H * 0.16;
  const radius = 46;

  ctx.save();

  ctx.shadowBlur = 40;
  ctx.shadowColor = "#9be8ff";
  ctx.fillStyle = "#eaffff";

  ctx.beginPath();
  ctx.arc(mx, my, radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(130, 205, 255, 0.22)";

  ctx.beginPath();
  ctx.arc(mx - 15, my + 5, 9, 0, Math.PI * 2);
  ctx.arc(mx + 14, my - 14, 6, 0, Math.PI * 2);
  ctx.arc(mx + 11, my + 20, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawCity() {
  const shift = (scrollX * 0.3) % TILE_W;
  const baseY = groundBaseline + 10;

  ctx.save();

  for (let tile = -1; tile <= 2; tile++) {
    const tileOffset = tile * TILE_W - shift;

    for (const b of buildings) {
      const x = tileOffset + b.x;

      if (x > W + 50 || x < -150) continue;

      ctx.fillStyle = "rgba(10, 8, 30, 0.9)";
      ctx.fillRect(x, baseY - b.h, b.w, b.h);

      if (b.lit) {
        ctx.fillStyle = "rgba(0, 255, 255, 0.35)";
        ctx.shadowBlur = 6;
        ctx.shadowColor = "#00eaff";

        for (let wy = baseY - b.h + 10; wy < baseY - 8; wy += 16) {
          ctx.fillRect(x + 6, wy, b.w - 12, 4);
        }

        ctx.shadowBlur = 0;
      }
    }
  }

  ctx.restore();
}

function getGroundPoints() {
  const bikeX = BIKE_SCREEN_X();
  const points = [];

  for (let sx = 0; sx <= W + 8; sx += 8) {
    const worldX = scrollX + (sx - bikeX);
    let y = groundYAt(worldX);

    for (const o of obstacles) {
      if (o.type !== "pit") continue;

      const half = o.width / 2;
      const left = o.worldX - half;
      const right = o.worldX + half;
      const margin = 18;

      if (worldX > left - margin && worldX < right + margin) {
        let depthFactor = 1;

        if (worldX < left) {
          depthFactor = (worldX - (left - margin)) / margin;
        } else if (worldX > right) {
          depthFactor = 1 - (worldX - right) / margin;
        }

        depthFactor = Math.max(0, Math.min(1, depthFactor));
        y += depthFactor * 260;
      }
    }

    points.push([sx, y]);
  }

  return points;
}

function drawGround() {
  const points = getGroundPoints();

  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);

  for (const p of points) {
    ctx.lineTo(p[0], p[1]);
  }

  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();

  const gradient = ctx.createLinearGradient(0, groundBaseline - 100, 0, H);
  gradient.addColorStop(0, "#160a2e");
  gradient.addColorStop(1, "#050208");

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);

  for (const p of points) {
    ctx.lineTo(p[0], p[1]);
  }

  ctx.strokeStyle = "#00eaff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 16;
  ctx.shadowColor = "#00eaff";
  ctx.stroke();

  ctx.shadowBlur = 0;
}

function drawObstaclesAndCoins() {
  for (const o of obstacles) {
    const sx = worldToScreenX(o.worldX);

    if (sx < -120 || sx > W + 120) continue;

    if (o.type === "rock") {
      const gy = groundYAt(o.worldX);

      ctx.save();

      ctx.shadowBlur = 18;
      ctx.shadowColor = "#ff5d3d";

      ctx.fillStyle = "#3a1408";
      ctx.strokeStyle = "#ff5d3d";
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(sx - o.width / 2, gy);
      ctx.lineTo(sx - o.width * 0.15, gy - o.height * 0.82);
      ctx.lineTo(sx + o.width * 0.12, gy - o.height);
      ctx.lineTo(sx + o.width / 2, gy);
      ctx.closePath();

      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
  }

  for (const c of coins) {
    if (c.collected) continue;

    const sx = worldToScreenX(c.worldX);

    if (sx < -60 || sx > W + 60) continue;

    const sy = groundYAt(c.worldX) - c.h;
    const pulse = 0.5 + 0.5 * Math.sin(animTime * 6 + c.worldX * 0.01);
    const radius = 10 + pulse * 2;

    ctx.save();

    ctx.shadowBlur = 20 + pulse * 12;
    ctx.shadowColor = "#ffe95c";

    ctx.fillStyle = "#fff6c9";

    ctx.beginPath();
    ctx.arc(sx, sy, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ffcc33";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ffcc33";
    ctx.fillRect(sx - 1.5, sy - 5, 3, 10);

    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, 1 - p.age / p.life);

    ctx.save();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawWheel(x, y, radius, spin) {
  ctx.save();

  ctx.translate(x, y);
  ctx.rotate(spin);

  ctx.strokeStyle = "#ff00e0";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 12;
  ctx.shadowColor = "#ff00e0";

  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = "#dffcff";
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 6;
  ctx.shadowColor = "#00eaff";

  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 / 8) * i;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * (radius - 3), Math.sin(a) * (radius - 3));
    ctx.stroke();
  }

  ctx.fillStyle = "#00eaff";

  ctx.beginPath();
  ctx.arc(0, 0, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBike() {
  const bikeX = BIKE_SCREEN_X();
  const baseY = groundYAt(scrollX) - flightOffset;
  const wheelY = baseY - WHEEL_R;

  const speedRatio = speed / MAX_SPEED;
  const spin = scrollX * 0.04;

  const rearX = bikeX - 28;
  const frontX = bikeX + 31;

  const bodyY = wheelY - 20;
  const crashTilt = gameState === "crash" ? crashTimer * 5 : 0;

  ctx.save();

  ctx.translate(bikeX, wheelY);
  ctx.rotate(-crashTilt);
  ctx.translate(-bikeX, -wheelY);

  drawWheel(rearX, wheelY, WHEEL_R, spin);
  drawWheel(frontX, wheelY, WHEEL_R, spin);

  ctx.save();

  ctx.strokeStyle = "#00eaff";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowBlur = 15;
  ctx.shadowColor = "#00eaff";

  ctx.beginPath();
  ctx.moveTo(rearX, wheelY);
  ctx.lineTo(bikeX - 5, bodyY);
  ctx.lineTo(frontX, wheelY);
  ctx.lineTo(bikeX + 9, bodyY);
  ctx.lineTo(rearX, wheelY);
  ctx.stroke();

  ctx.strokeStyle = "#ff00e0";
  ctx.shadowColor = "#ff00e0";

  ctx.beginPath();
  ctx.moveTo(bikeX - 5, bodyY);
  ctx.lineTo(bikeX + 2, bodyY - 24);
  ctx.lineTo(bikeX + 18, bodyY - 26);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bikeX + 9, bodyY);
  ctx.lineTo(bikeX + 25, bodyY - 17);
  ctx.lineTo(bikeX + 35, bodyY - 17);
  ctx.stroke();

  ctx.restore();

  ctx.save();

  ctx.shadowBlur = 18;
  ctx.shadowColor = "#00eaff";

  ctx.fillStyle = "#071c38";
  ctx.strokeStyle = "#00eaff";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(bikeX - 17, bodyY - 5);
  ctx.lineTo(bikeX + 12, bodyY - 12);
  ctx.lineTo(bikeX + 25, bodyY - 3);
  ctx.lineTo(bikeX + 2, bodyY + 5);
  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#dffcff";

  ctx.beginPath();
  ctx.arc(bikeX + 3, bodyY - 25, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#ff00e0";
  ctx.lineWidth = 4;
  ctx.shadowColor = "#ff00e0";

  ctx.beginPath();
  ctx.moveTo(bikeX + 2, bodyY - 17);
  ctx.lineTo(bikeX - 4, bodyY - 2);
  ctx.lineTo(bikeX - 18, bodyY - 7);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bikeX - 3, bodyY - 1);
  ctx.lineTo(bikeX + 12, bodyY + 2);
  ctx.stroke();

  ctx.restore();

  const flameLength = 14 + speedRatio * 22 + Math.sin(animTime * 25) * 4;

  ctx.save();

  ctx.strokeStyle = "#00eaff";
  ctx.lineWidth = 4;
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#00eaff";

  ctx.beginPath();
  ctx.moveTo(bikeX - 19, bodyY - 3);
  ctx.lineTo(bikeX - 19 - flameLength, bodyY + 2);
  ctx.stroke();

  ctx.strokeStyle = "#ff00e0";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(bikeX - 19, bodyY - 2);
  ctx.lineTo(bikeX - 15 - flameLength * 0.65, bodyY - 5);
  ctx.stroke();

  ctx.restore();
  ctx.restore();
}

function drawMenuBike() {
  const x = W * 0.5;
  const y = H * 0.76;
  const scale = Math.min(1.35, W / 500);

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.translate(-x, -y);

  const rearX = x - 28;
  const frontX = x + 31;
  const wheelY = y;

  drawWheel(rearX, wheelY, WHEEL_R, animTime * 3);
  drawWheel(frontX, wheelY, WHEEL_R, animTime * 3);

  ctx.strokeStyle = "#00eaff";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowBlur = 16;
  ctx.shadowColor = "#00eaff";

  ctx.beginPath();
  ctx.moveTo(rearX, wheelY);
  ctx.lineTo(x - 5, y - 20);
  ctx.lineTo(frontX, wheelY);
  ctx.lineTo(x + 9, y - 20);
  ctx.lineTo(rearX, wheelY);
  ctx.stroke();

  ctx.strokeStyle = "#ff00e0";
  ctx.shadowColor = "#ff00e0";

  ctx.beginPath();
  ctx.moveTo(x - 5, y - 20);
  ctx.lineTo(x + 2, y - 44);
  ctx.lineTo(x + 20, y - 45);
  ctx.stroke();

  ctx.fillStyle = "#dffcff";
  ctx.beginPath();
  ctx.arc(x + 3, y - 45, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  drawSky();
  drawStars();
  drawMoon();
  drawCity();
  drawGround();
  drawObstaclesAndCoins();
  drawParticles();

  if (gameState === "menu") {
    drawMenuBike();
  } else {
    drawBike();
  }
}

function gameLoop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

resize();
backToMenuInit();
hudBest.textContent = bestDistance;
requestAnimationFrame(gameLoop);
</script>
